services:
  mongo:
    image: mongo:7
    container_name: food-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"      
      - "29092:29092"     
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" 
    
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - app-network


  foodservice1:
    build:
      context: .
      dockerfile: ./first_microserv.dockerfile
    container_name: FoodService
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      MongoDbSettings__DatabaseName: "FoodDB1"
      Kafka__BootstrapServers: "kafka:29092"
      UserService__BaseUrl: "http://user-service:8080/"
    restart: unless-stopped
    depends_on:
      - kafka      
      - mongo
      - redis
      - user-service
    networks:
      - app-network

  user-service:
    build:
      context: ./UserService
      dockerfile: User.dockerfile
    container_name: User-Service
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__BootstrapServers: "kafka:29092"
    restart: unless-stopped
    depends_on:
      - kafka
      - mongo
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: ./AuthService/Dockerfile
    container_name: Auth-Service
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Database__ConnectionString: "mongodb://mongo:27017"
      Database__DatabaseName: "UserDb"
      Database__CollectionName: "Users"
      Jwt__Key: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a secret of at least 32 bytes}"
      Jwt__Issuer: "FoodSelection"
      Jwt__Audience: "FoodSelectionClients"
    restart: unless-stopped
    depends_on:
      - mongo
    networks:
      - app-network

  api-gateway:
    build:
      context: .
      dockerfile: ./ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "7210:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Services__FoodService: "http://foodservice1:8080/"
      Services__UserService: "http://user-service:8080/"
      Services__AuthService: "http://auth-service:8080/"
      Jwt__Key: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a secret of at least 32 bytes}"
      Jwt__Issuer: "FoodSelection"
      Jwt__Audience: "FoodSelectionClients"
    restart: unless-stopped
    depends_on:
      - foodservice1
      - user-service
      - auth-service
    networks:
      - app-network
  
  prometheus:
    image: prom/prometheus:latest
    container_name: food-prometheus
    depends_on:
      - foodservice1
      - user-service
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network
    ports:
      - "9090:9090"
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: food-redis
    ports:
      - "6380:6379"
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: food-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

volumes:
  mongo_data:
  kafka_data:        
  grafana_data:
  redis_data:

networks:
  app-network:
    driver: bridge